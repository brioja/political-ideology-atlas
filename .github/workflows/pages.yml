# Deploys the site to GitHub Pages on every push to main. The site is plain static files, so
# there is no build step: the repository is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Files the site never shows. A push touching only these starts no deploy, so it can't cancel one;
    # the next deploy uploads them anyway. scripts/ isn't listed: pages.js runs here.
    paths-ignore:
      - '.claude/**'
      - 'backlog/**'
      - 'tests/**'
      - 'test.js'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'audits/**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push matters: cancel any deploy still queued or running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Stamp this commit onto the script links so phones never mix a new page with old cached scripts.
      - name: Version script links
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html
      # Static ideology and people pages plus sitemap.xml for search engines, from the stamped index.html.
      - name: Write static pages
        run: node scripts/pages.js --stamp
      - uses: actions/configure-pages@v6
      # Dotfiles stay out of the artifact (v4 on); the site serves none.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # About one deploy in seven failed with "Fetching artifact metadata failed" a second after a good upload
      # (2026-11-21..23), each emailing Brandon: one retry after a pause, so only a second failure fails the run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
