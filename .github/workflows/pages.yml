# Deploys the site to GitHub Pages on every push to main. The site is plain static files, so
# there is no build step: the repository is uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Files the site never shows. A push touching only these starts no deploy, so it can't cancel one;
    # the next deploy uploads them anyway. scripts/ isn't listed: pages.js runs here.
    paths-ignore:
      - '.claude/**'
      - 'backlog/**'
      - 'tests/**'
      - 'test.js'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'audits/**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push matters: cancel any deploy still queued or running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp this commit onto the script links so phones never mix a new page with old cached scripts.
      - name: Version script links
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html
      # Static ideology and people pages plus sitemap.xml for search engines, from the stamped index.html.
      - name: Write static pages
        run: node scripts/pages.js --stamp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
