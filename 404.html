<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not in the atlas · Political Ideology Atlas</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<!-- GitHub Pages serves this page for any missing address. A person or ideology page goes missing when
     its subject leaves the site (its sources no longer place it precisely enough), so the page names
     the subject from the address and says why it may be missing (Brandon, 2026-11-09). -->
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6776; --line: #d3d9e1; --accent: #1f6f78;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #98a4b2; --line: #2c3743; --accent: #5fbcc5; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 var(--body); }
.wrap { max-width: calc(46rem + 32px); margin: 0 auto; padding: 1.25rem max(16px, env(safe-area-inset-left, 0px)) 4rem; }
.brand { display: inline-flex; align-items: center; gap: 0.6rem; color: var(--ink); text-decoration: none; font: 700 1.05rem/1 var(--display); }
.brand img { width: 28px; height: 28px; }
h1 { font: 700 clamp(2rem, 6vw, 2.8rem)/1.15 var(--display); letter-spacing: -0.02em; margin: 3rem 0 1rem; overflow-wrap: break-word; text-wrap: balance; }
p { margin: 0 0 1rem; max-width: 65ch; }
.muted { color: var(--muted); }
a { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; margin-top: 1.5rem; font-family: var(--display); }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/"><img src="/favicon.svg" alt="">Political Ideology Atlas</a>
  <h1 id="title">This page isn't in the atlas</h1>
  <p id="why" class="muted">The address may be mistyped, or the page may have moved.</p>
  <p class="links" id="links"><a href="/">Home</a><a href="/#/test">Take the test</a><a href="/#/about">About</a></p>
</div>
<script>
// /people/<id>/ or /ideologies/<id>/: name the subject from its address (ids are names in lower case with dashes).
const m = /^\/(people|ideologies)\/([^/]+)\/?$/.exec(location.pathname);
if (m) {
  const words = decodeURIComponent(m[2]).split("-").filter(Boolean);
  const name = words.map((w, i) => (i && m[1] === "ideologies") ? w : w[0].toUpperCase() + w.slice(1)).join(" ");
  const person = m[1] === "people";
  document.getElementById("title").textContent = `${name} isn't in the atlas right now`;
  document.title = `${name}: not in the atlas · Political Ideology Atlas`;
  document.getElementById("why").textContent = `${person ? "People" : "Ideologies"} are listed only when their sources place them precisely enough to tell nearby ideologies apart. If this ${person ? "person" : "ideology"} was here before, a closer look found too little evidence to place ${person ? "them" : "it"} with confidence. A later research pass may bring ${person ? "them" : "it"} back.`;
  document.getElementById("links").innerHTML = `<a href="/#/${m[1]}">Browse ${m[1]}</a><a href="/#/test">Take the test</a><a href="/#/about">Why some are left out</a>`;
}
</script>
</body>
</html>
